name: Publicar Pasaporte Eanista

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp index.html admin.html admin-experiencias.html formulario-demo.html pasaporte-e2e.html pasaporte-e2e.js styles.css app.js admin.js admin-live.js form-builder.js api-client.js catalogs.js demo-api.js foundershub-form-definition.json .nojekyll _site/
          cp -R assets _site/assets
          node -e "const fs=require('fs'); fs.writeFileSync('_site/runtime-config.js','window.PASAPORTE_CONFIG='+JSON.stringify({pa08Url:'https://pasaporte-eanista-api.afcaballero.workers.dev/api/pa08',pa09AdminUrl:'https://pasaporte-eanista-api.afcaballero.workers.dev/api/pa09',pa11Url:'https://pasaporte-eanista-api.afcaballero.workers.dev/api/pa11',timeoutMs:180000})+';\\n')"
          test -s _site/api-client.js
          test -s _site/pasaporte-e2e.js
          grep -q "requestAccessCode" _site/api-client.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
